[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ewbot"
version = "0.1.0"
description = "Elliott Wave BTC bot - research core"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
    "requests>=2.31",
    "plotly>=5.20",
]

[project.scripts]
ewbot = "ewbot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ewbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
